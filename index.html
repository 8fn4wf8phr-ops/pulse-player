<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121A;
    --surface: #1E1B26;
    --surface-raised: #26222F;
    --text: #F2EFEA;
    --text-dim: #9A93A6;
    --accent: #FF5C7A;
    --accent-dim: rgba(255, 92, 122, 0.18);
    --track-bg: #362F42;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .player {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  /* Library bar */
  .lib-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .lib-toggle {
    width: auto;
    height: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
  }
  .lib-toggle svg { width: 15px; height: 15px; }

  .lib-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lib-actions .btn.secondary svg { width: 18px; height: 18px; }

  .art {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius);
    background: linear-gradient(155deg, #3A2E45 0%, #241E2C 60%, #1A1621 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .art canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Library / settings panels — overlay the art square */
  .library-panel,
  .settings-panel {
    position: absolute;
    inset: 0;
    background: rgba(20, 18, 26, 0.97);
    border-radius: var(--radius);
    opacity: 0;
    pointer-events: none;
    transform: translateY(6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
    display: flex;
    padding: 6px;
  }
  .library-panel.open,
  .settings-panel.open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .library-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
  }

  .lib-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 9px 10px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font: inherit;
  }
  .lib-row:hover { background: var(--surface-raised); }
  .lib-row.active { background: var(--accent-dim); }
  .lib-row.active .lib-row-title { color: var(--accent); }

  .lib-row-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13px;
  }
  .lib-row-artist {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
  }

  .lib-empty {
    margin: auto;
    max-width: 220px;
    text-align: center;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }

  /* Settings panel */
  .settings-panel {
    align-items: center;
    padding: 22px;
  }
  .settings-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .settings-heading {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0;
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .settings-label {
    font-size: 13px;
    color: var(--text);
    flex-shrink: 0;
    width: 54px;
  }
  .settings-toggle {
    color: var(--text-dim);
    width: 20px;
    height: 20px;
  }
  .settings-toggle svg { width: 18px; height: 18px; }
  .settings-toggle.toggled { color: var(--accent); }

  .track-info {
    margin-top: 22px;
    text-align: left;
  }

  .track-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .track-artist {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0;
  }

  /* Progress */
  .progress-wrap {
    margin-top: 24px;
  }

  .progress-bar {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--track-bg);
    cursor: pointer;
  }

  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
  }

  .progress-handle {
    position: absolute;
    top: 50%;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text);
    transform: translate(-50%, -50%);
    left: 0%;
    box-shadow: 0 0 0 4px var(--accent-dim);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .progress-bar:hover .progress-handle { opacity: 1; }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 26px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color 0.15s ease, transform 0.1s ease;
  }

  .btn:hover { color: var(--accent); }
  .btn:active { transform: scale(0.92); }

  .btn.secondary {
    color: var(--text-dim);
    width: 20px;
    height: 20px;
  }
  .btn.secondary svg { width: 18px; height: 18px; }

  .btn.skip svg { width: 22px; height: 22px; }

  .btn.play {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
  }
  .btn.play:hover { color: var(--bg); filter: brightness(1.08); }
  .btn.play svg { width: 22px; height: 22px; }

  .btn.toggled { color: var(--accent); }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
  }

  .volume-row svg {
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  input[type="range"].volume,
  input[type="range"].eq-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--track-bg);
    outline: none;
  }

  input[type="range"].volume::-webkit-slider-thumb,
  input[type="range"].eq-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }

  input[type="range"].volume::-moz-range-thumb,
  input[type="range"].eq-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }

  /* Drag-and-drop overlay, covers the viewport while files are dragged in */
  .dropzone-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 26, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 999;
  }
  .dropzone-overlay.active { opacity: 1; pointer-events: auto; }

  .dropzone-inner {
    border: 2px dashed var(--accent);
    border-radius: 20px;
    padding: 40px 56px;
    text-align: center;
  }
  .dropzone-inner svg { width: 30px; height: 30px; color: var(--accent); margin-bottom: 12px; }
  .dropzone-inner p {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .progress-handle, .library-panel, .settings-panel { transition: none; }
  }

  .btn:focus-visible,
  .lib-row:focus-visible,
  input.volume:focus-visible,
  input.eq-slider:focus-visible,
  .progress-bar:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="player">
  <div class="lib-bar">
    <button class="btn secondary lib-toggle" id="libraryBtn" aria-label="Show library" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      <span id="libCount">0 tracks</span>
    </button>
    <div class="lib-actions">
      <button class="btn secondary" id="addFilesBtn" aria-label="Add songs" title="Add songs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button class="btn secondary" id="addFolderBtn" aria-label="Add folder of songs" title="Add folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      </button>
      <button class="btn secondary" id="settingsBtn" aria-label="Sound settings" aria-pressed="false" title="Sound settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </div>

  <div class="art" aria-hidden="true">
    <canvas id="visualizer"></canvas>

    <div class="library-panel" id="libraryPanel">
      <div class="library-list" id="libraryList"></div>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-inner">
        <p class="settings-heading">Playback</p>
        <div class="settings-row">
          <span class="settings-label">Crossfade</span>
          <button class="btn settings-toggle" id="crossfadeBtn" aria-label="Toggle crossfade between tracks" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.5-5 5-5 7 0s4.5 5 7 0 4.5-5 6-2"></path></svg>
          </button>
        </div>

        <p class="settings-heading">Equalizer</p>
        <div class="settings-row">
          <span class="settings-label">Bass</span>
          <input type="range" class="eq-slider" id="eqBass" min="-12" max="12" step="1" value="0" aria-label="Bass">
        </div>
        <div class="settings-row">
          <span class="settings-label">Mid</span>
          <input type="range" class="eq-slider" id="eqMid" min="-12" max="12" step="1" value="0" aria-label="Mid">
        </div>
        <div class="settings-row">
          <span class="settings-label">Treble</span>
          <input type="range" class="eq-slider" id="eqTreble" min="-12" max="12" step="1" value="0" aria-label="Treble">
        </div>
      </div>
    </div>
  </div>

  <div class="track-info">
    <p class="track-title" id="trackTitle">—</p>
    <p class="track-artist" id="trackArtist">Add a track to get started</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-handle" id="progressHandle"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
    </button>

    <button class="btn skip" id="prevBtn" aria-label="Previous track">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l10 6.5v-13z"></path></svg>
    </button>

    <button class="btn play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
    </button>

    <button class="btn skip" id="nextBtn" aria-label="Next track">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 5.5v13l10-6.5z"></path></svg>
    </button>

    <button class="btn secondary" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
    </button>
  </div>

  <div class="volume-row">
    <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
    <input type="range" class="volume" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
  </div>
</div>

<div class="dropzone-overlay" id="dropOverlay">
  <div class="dropzone-inner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
    <p>Drop mp3s or a folder to add them</p>
  </div>
</div>

<audio id="audioA"></audio>
<audio id="audioB"></audio>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" multiple hidden>
<input type="file" id="folderInput" webkitdirectory multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
  const audioA = document.getElementById('audioA');
  const audioB = document.getElementById('audioB');
  const els = { A: audioA, B: audioB };
  let activeSlot = 'A';
  function activeEl() { return els[activeSlot]; }
  function inactiveSlotKey() { return activeSlot === 'A' ? 'B' : 'A'; }
  function isActive(el) { return el === activeEl(); }

  const canvas = document.getElementById('visualizer');
  const canvasCtx = canvas.getContext('2d');
  const artEl = document.querySelector('.art');
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FF5C7A';

  const CROSSFADE_SECONDS = 4;
  let crossfadeInProgress = false;

  let audioCtx, analyser, dataArray, bufferLength;
  const webAudioSlots = {}; // { A: {source, bass, mid, treble, gain}, B: {...} } — built lazily, once, after a user gesture
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  const accentRgb = hexToRgb(accentColor);
  function accentAlpha(a) { return `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, ${a})`; }

  // Smoothed 0-1 read of overall loudness across the full spectrum, updated
  // every frame in drawActive() and used to drive the active-state color.
  let smoothedEnergy = 0;

  function energyColor(energy, alpha) {
    // Base hue starts near the current accent's hue, shifts warmer as energy rises
    const baseHue = 340; // roughly matches the current pink/red accent (#FF5C7A)
    const hue = baseHue - energy * 60; // shifts toward orange/yellow as energy increases
    const saturation = 70 + energy * 20;
    const lightness = 55 + energy * 10;
    return `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
  }

  function resizeCanvas() {
    const size = artEl.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Each <audio> element gets its own bass/mid/treble filter chain and gain
  // node (the gain is what crossfade ramps between 0 and 1), then both
  // chains feed one shared analyser so the visualizer sees combined output.
  function buildChain(el) {
    const source = audioCtx.createMediaElementSource(el);
    const bass = audioCtx.createBiquadFilter();
    bass.type = 'lowshelf';
    bass.frequency.value = 200;
    const mid = audioCtx.createBiquadFilter();
    mid.type = 'peaking';
    mid.frequency.value = 1000;
    mid.Q.value = 1;
    const treble = audioCtx.createBiquadFilter();
    treble.type = 'highshelf';
    treble.frequency.value = 4000;
    const gain = audioCtx.createGain();
    source.connect(bass);
    bass.connect(mid);
    mid.connect(treble);
    treble.connect(gain);
    gain.connect(analyser);
    return { source, bass, mid, treble, gain };
  }

  // Web Audio graph can only be created after a user gesture, and
  // createMediaElementSource can only ever be called once per <audio> element.
  function setupAudioGraph() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    analyser.connect(audioCtx.destination);

    webAudioSlots.A = buildChain(audioA);
    webAudioSlots.B = buildChain(audioB);
    applyEQ();
  }

  function drawIdle(time) {
    const size = artEl.clientWidth;
    const cx = size / 2, cy = size / 2;
    const breathe = prefersReducedMotion ? 0 : Math.sin(time / 1200) * 0.04;
    const baseR = size * 0.16;

    canvasCtx.clearRect(0, 0, size, size);

    [0.42, 0.66, 0.88].forEach((mult, i) => {
      canvasCtx.beginPath();
      canvasCtx.arc(cx, cy, size * mult * (1 + (i === 0 ? breathe : 0)) / 2, 0, Math.PI * 2);
      canvasCtx.strokeStyle = accentAlpha(0.35 - i * 0.11);
      canvasCtx.lineWidth = 1.5;
      canvasCtx.stroke();
    });

    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, baseR * (1 + breathe), 0, Math.PI * 2);
    canvasCtx.fillStyle = accentAlpha(0.16);
    canvasCtx.fill();
  }

  function drawActive() {
    const size = artEl.clientWidth;
    const cx = size / 2, cy = size / 2;
    analyser.getByteFrequencyData(dataArray);

    canvasCtx.clearRect(0, 0, size, size);

    // Bass-driven pulsing core (average of the lowest few bins) — stays
    // bass-only; it's the overall spectrum average below that drives color.
    const bassBins = 4;
    let bassSum = 0;
    for (let i = 0; i < bassBins; i++) bassSum += dataArray[i];
    const bassAvg = bassSum / bassBins / 255;
    const coreR = size * 0.14 * (1 + bassAvg * 0.5);

    // Full-spectrum loudness, smoothed with an exponential moving average
    // (90% previous frame / 10% new sample) so the color eases rather than
    // flickering frame to frame.
    let spectrumSum = 0;
    for (let i = 0; i < bufferLength; i++) spectrumSum += dataArray[i];
    const rawEnergy = spectrumSum / bufferLength / 255;
    smoothedEnergy = smoothedEnergy * 0.9 + rawEnergy * 0.1;

    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, coreR, 0, Math.PI * 2);
    canvasCtx.fillStyle = energyColor(smoothedEnergy, 0.25 + bassAvg * 0.25);
    canvasCtx.shadowColor = energyColor(smoothedEnergy, 0.5);
    canvasCtx.shadowBlur = size * 0.06 * (0.5 + bassAvg);
    canvasCtx.fill();
    canvasCtx.shadowBlur = 0;

    // Radial frequency bars
    const numBars = bufferLength;
    const baseRadius = size * 0.2;
    const maxBarLength = size * 0.18;
    const lineWidth = Math.max(1.5, size * 0.008);

    canvasCtx.lineCap = 'round';
    canvasCtx.lineWidth = lineWidth;

    for (let i = 0; i < numBars; i++) {
      const value = dataArray[i] / 255;
      const angle = (i / numBars) * Math.PI * 2 - Math.PI / 2;
      const barLen = Math.max(size * 0.01, value * maxBarLength);
      const x1 = cx + Math.cos(angle) * baseRadius;
      const y1 = cy + Math.sin(angle) * baseRadius;
      const x2 = cx + Math.cos(angle) * (baseRadius + barLen);
      const y2 = cy + Math.sin(angle) * (baseRadius + barLen);

      canvasCtx.strokeStyle = energyColor(smoothedEnergy, 0.35 + value * 0.65);
      canvasCtx.beginPath();
      canvasCtx.moveTo(x1, y1);
      canvasCtx.lineTo(x2, y2);
      canvasCtx.stroke();
    }
  }

  function animate(time) {
    requestAnimationFrame(animate);
    if (analyser && isPlaying) {
      drawActive();
    } else {
      drawIdle(time || 0);
    }
  }
  requestAnimationFrame(animate);

  let isPlaying = false;
  let isSeeking = false;

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const crossfadeBtn = document.getElementById('crossfadeBtn');
  const eqBassSlider = document.getElementById('eqBass');
  const eqMidSlider = document.getElementById('eqMid');
  const eqTrebleSlider = document.getElementById('eqTreble');

  // The library starts empty — songs are added at runtime via the
  // "add songs" / "add folder" buttons or by dragging files onto the page,
  // then persisted in IndexedDB so they survive a reload.
  let tracks = [];
  let trackIndex = 0;
  let playOrder = [];
  let orderPos = 0;

  // Keeps the current track first so shuffling doesn't yank playback
  // sideways; rebuild whenever the library or the shuffle toggle changes.
  function rebuildOrder() {
    const indices = tracks.map((_, i) => i);
    if (shuffleBtn.classList.contains('toggled')) {
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const pos = indices.indexOf(trackIndex);
      if (pos > 0) [indices[0], indices[pos]] = [indices[pos], indices[0]];
    }
    playOrder = indices;
    orderPos = Math.max(0, playOrder.indexOf(trackIndex));
  }

  function stepTrack(delta, autoplay) {
    if (!tracks.length) return;
    if (!playOrder.length) rebuildOrder();
    orderPos = (orderPos + delta + playOrder.length) % playOrder.length;
    switchTrack(playOrder[orderPos], autoplay);
  }

  function updateMediaSessionMetadata(track) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = track
      ? new MediaMetadata({ title: track.title, artist: track.artist })
      : null;
  }

  function setNowPlayingUI(track) {
    document.getElementById('trackTitle').textContent = track.title;
    document.getElementById('trackArtist').textContent = track.artist;
    updateMediaSessionMetadata(track);
  }

  function resetProgressUI() {
    progressFill.style.width = '0%';
    progressHandle.style.left = '0%';
    currentTimeEl.textContent = '0:00';
    durationEl.textContent = '0:00';
  }

  // Hard cut: used whenever crossfade is off, unavailable, or nothing is
  // currently playing (nothing to fade out of).
  function hardSwitch(index, autoplay) {
    if (!tracks.length) {
      trackIndex = 0;
      activeEl().pause();
      activeEl().removeAttribute('src');
      document.getElementById('trackTitle').textContent = '—';
      document.getElementById('trackArtist').textContent = 'Add a track to get started';
      updateMediaSessionMetadata(null);
      resetProgressUI();
      renderLibrary();
      return;
    }
    trackIndex = (index + tracks.length) % tracks.length;
    const track = tracks[trackIndex];
    const el = activeEl();
    el.pause();
    el.src = track.url;
    setNowPlayingUI(track);
    resetProgressUI();
    orderPos = Math.max(0, playOrder.indexOf(trackIndex));
    if (track.id != null) localStorage.setItem('pulse:lastTrackId', track.id);
    renderLibrary();
    if (autoplay) el.play().catch(() => {});
  }

  // Crossfades into a new track by playing it on the currently-idle audio
  // element and ramping gain between the two, falling back to a hard cut
  // when crossfade is off, the audio graph isn't ready yet, or nothing is
  // currently playing (there's nothing to fade out of).
  async function switchTrack(index, autoplay = true) {
    if (!tracks.length) { hardSwitch(index, autoplay); return; }
    index = (index + tracks.length) % tracks.length;

    const canCrossfade =
      audioCtx &&
      crossfadeBtn.classList.contains('toggled') &&
      isPlaying &&
      !crossfadeInProgress &&
      index !== trackIndex;

    if (!canCrossfade) {
      hardSwitch(index, autoplay);
      return;
    }

    crossfadeInProgress = true;
    const fromKey = activeSlot;
    const toKey = inactiveSlotKey();
    const fromEl = els[fromKey];
    const toEl = els[toKey];
    const fromGain = webAudioSlots[fromKey].gain.gain;
    const toGain = webAudioSlots[toKey].gain.gain;
    const track = tracks[index];

    toEl.src = track.url;
    toGain.cancelScheduledValues(audioCtx.currentTime);
    toGain.setValueAtTime(0, audioCtx.currentTime);
    try { await toEl.play(); } catch (err) { /* ignore */ }

    const now = audioCtx.currentTime;
    fromGain.cancelScheduledValues(now);
    fromGain.setValueAtTime(fromGain.value, now);
    fromGain.linearRampToValueAtTime(0, now + CROSSFADE_SECONDS);
    toGain.cancelScheduledValues(now);
    toGain.setValueAtTime(0, now);
    toGain.linearRampToValueAtTime(1, now + CROSSFADE_SECONDS);

    activeSlot = toKey;
    trackIndex = index;
    orderPos = Math.max(0, playOrder.indexOf(trackIndex));
    if (track.id != null) localStorage.setItem('pulse:lastTrackId', track.id);
    setNowPlayingUI(track);
    renderLibrary();

    setTimeout(() => {
      fromEl.pause();
      fromEl.currentTime = 0;
      fromEl.removeAttribute('src');
      fromGain.value = 1;
      crossfadeInProgress = false;
    }, CROSSFADE_SECONDS * 1000 + 150);
  }

  function formatTime(seconds) {
    if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    if ('mediaSession' in navigator) {
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    }
  }

  playBtn.addEventListener('click', () => {
    if (!tracks.length) { addFilesBtn.click(); return; }
    setupAudioGraph();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const el = activeEl();
    if (isPlaying) {
      el.pause();
    } else {
      el.play().catch(() => {});
    }
  });

  function handleTimeUpdate(el) {
    if (!isActive(el) || isSeeking) return;
    const pct = el.duration ? (el.currentTime / el.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.left = pct + '%';
    progressBar.setAttribute('aria-valuenow', Math.round(pct));
    currentTimeEl.textContent = formatTime(el.currentTime);

    if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && el.duration) {
      try {
        navigator.mediaSession.setPositionState({ duration: el.duration, playbackRate: el.playbackRate, position: el.currentTime });
      } catch (err) { /* ignore unsupported position state */ }
    }

    const remaining = el.duration - el.currentTime;
    if (
      crossfadeBtn.classList.contains('toggled') &&
      !crossfadeInProgress &&
      !repeatBtn.classList.contains('toggled') &&
      tracks.length > 1 &&
      el.duration &&
      remaining > 0 &&
      remaining <= CROSSFADE_SECONDS
    ) {
      const nextIndex = playOrder[(orderPos + 1) % playOrder.length];
      switchTrack(nextIndex, true);
    }
  }

  function handleEnded(el) {
    if (!isActive(el)) return;
    if (repeatBtn.classList.contains('toggled')) {
      el.currentTime = 0;
      el.play().catch(() => {});
      return;
    }
    if (!crossfadeInProgress) stepTrack(1, true);
  }

  [audioA, audioB].forEach((el) => {
    el.addEventListener('play', () => { if (isActive(el)) setPlayingUI(true); });
    el.addEventListener('pause', () => { if (isActive(el)) setPlayingUI(false); });
    el.addEventListener('loadedmetadata', () => {
      if (isActive(el)) durationEl.textContent = formatTime(el.duration);
    });
    el.addEventListener('timeupdate', () => handleTimeUpdate(el));
    el.addEventListener('ended', () => handleEnded(el));
  });

  // Lets the OS/browser media notification show track info and respond to
  // hardware media keys (headphones, lock screen, etc).
  if ('mediaSession' in navigator) {
    const setHandler = (action, handler) => {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch (err) { /* unsupported action */ }
    };
    setHandler('play', () => playBtn.click());
    setHandler('pause', () => playBtn.click());
    setHandler('previoustrack', () => prevBtn.click());
    setHandler('nexttrack', () => nextBtn.click());
    setHandler('seekto', (details) => {
      const el = activeEl();
      if (details.seekTime != null && el.duration) el.currentTime = details.seekTime;
    });
  }

  function seekToClientX(clientX) {
    const el = activeEl();
    const rect = progressBar.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    progressFill.style.width = (pct * 100) + '%';
    progressHandle.style.left = (pct * 100) + '%';
    if (el.duration) {
      el.currentTime = pct * el.duration;
      currentTimeEl.textContent = formatTime(el.currentTime);
    }
  }

  progressBar.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    seekToClientX(e.clientX);
    progressBar.setPointerCapture(e.pointerId);
  });
  progressBar.addEventListener('pointermove', (e) => {
    if (isSeeking) seekToClientX(e.clientX);
  });
  progressBar.addEventListener('pointerup', () => { isSeeking = false; });

  function applyVolume() {
    const v = volumeSlider.value / 100;
    audioA.volume = v;
    audioB.volume = v;
  }

  volumeSlider.addEventListener('input', () => {
    applyVolume();
    volumeIcon.style.opacity = Number(volumeSlider.value) === 0 ? '0.4' : '1';
    localStorage.setItem('pulse:volume', volumeSlider.value);
  });

  shuffleBtn.addEventListener('click', () => {
    const active = shuffleBtn.classList.toggle('toggled');
    shuffleBtn.setAttribute('aria-pressed', active);
    localStorage.setItem('pulse:shuffle', active ? '1' : '0');
    rebuildOrder();
  });

  repeatBtn.addEventListener('click', () => {
    const active = repeatBtn.classList.toggle('toggled');
    repeatBtn.setAttribute('aria-pressed', active);
    localStorage.setItem('pulse:repeat', active ? '1' : '0');
  });

  crossfadeBtn.addEventListener('click', () => {
    const active = crossfadeBtn.classList.toggle('toggled');
    crossfadeBtn.setAttribute('aria-pressed', active);
    localStorage.setItem('pulse:crossfade', active ? '1' : '0');
  });

  function applyEQ() {
    if (!audioCtx) return;
    ['A', 'B'].forEach((key) => {
      webAudioSlots[key].bass.gain.value = Number(eqBassSlider.value);
      webAudioSlots[key].mid.gain.value = Number(eqMidSlider.value);
      webAudioSlots[key].treble.gain.value = Number(eqTrebleSlider.value);
    });
  }

  [[eqBassSlider, 'pulse:eqBass'], [eqMidSlider, 'pulse:eqMid'], [eqTrebleSlider, 'pulse:eqTreble']].forEach(([slider, key]) => {
    slider.addEventListener('input', () => {
      localStorage.setItem(key, slider.value);
      applyEQ();
    });
  });

  prevBtn.addEventListener('click', () => {
    // Restart current track if more than 3s in, otherwise go to previous track
    if (activeEl().currentTime > 3) {
      activeEl().currentTime = 0;
    } else {
      stepTrack(-1, isPlaying);
    }
  });

  nextBtn.addEventListener('click', () => {
    stepTrack(1, isPlaying);
  });

  // ---------------------------------------------------------------------
  // Library: import + browse tracks
  // ---------------------------------------------------------------------

  const libraryBtn = document.getElementById('libraryBtn');
  const libraryPanel = document.getElementById('libraryPanel');
  const libraryList = document.getElementById('libraryList');
  const libCountEl = document.getElementById('libCount');
  const addFilesBtn = document.getElementById('addFilesBtn');
  const addFolderBtn = document.getElementById('addFolderBtn');
  const fileInput = document.getElementById('fileInput');
  const folderInput = document.getElementById('folderInput');
  const dropOverlay = document.getElementById('dropOverlay');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');

  function openLibrary() {
    closeSettings();
    libraryPanel.classList.add('open');
    libraryBtn.setAttribute('aria-pressed', 'true');
  }
  function closeLibrary() {
    libraryPanel.classList.remove('open');
    libraryBtn.setAttribute('aria-pressed', 'false');
  }
  libraryBtn.addEventListener('click', () => {
    if (libraryPanel.classList.contains('open')) closeLibrary(); else openLibrary();
  });

  function openSettings() {
    closeLibrary();
    settingsPanel.classList.add('open');
    settingsBtn.setAttribute('aria-pressed', 'true');
  }
  function closeSettings() {
    settingsPanel.classList.remove('open');
    settingsBtn.setAttribute('aria-pressed', 'false');
  }
  settingsBtn.addEventListener('click', () => {
    if (settingsPanel.classList.contains('open')) closeSettings(); else openSettings();
  });

  // Global shortcuts: space to play/pause, left/right to seek, up/down for
  // volume. Skipped while a form control has focus so native behavior
  // (e.g. arrow keys on a focused range slider) isn't double-handled.
  function isTypingTarget(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A' || el.isContentEditable;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeLibrary(); closeSettings(); return; }
    if (isTypingTarget(document.activeElement)) return;

    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      playBtn.click();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      const el = activeEl();
      if (el.duration) el.currentTime = Math.min(el.duration, el.currentTime + 5);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      const el = activeEl();
      if (el.duration) el.currentTime = Math.max(0, el.currentTime - 5);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      volumeSlider.value = Math.min(100, Number(volumeSlider.value) + 5);
      volumeSlider.dispatchEvent(new Event('input'));
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      volumeSlider.value = Math.max(0, Number(volumeSlider.value) - 5);
      volumeSlider.dispatchEvent(new Event('input'));
    }
  });

  function renderLibrary() {
    libCountEl.textContent = `${tracks.length} track${tracks.length === 1 ? '' : 's'}`;
    libraryList.innerHTML = '';

    if (!tracks.length) {
      const empty = document.createElement('p');
      empty.className = 'lib-empty';
      empty.textContent = 'No tracks yet — use the + or folder button above, or drop mp3 files anywhere on the page.';
      libraryList.appendChild(empty);
      return;
    }

    tracks.forEach((track, i) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'lib-row' + (i === trackIndex ? ' active' : '');

      const titleSpan = document.createElement('span');
      titleSpan.className = 'lib-row-title';
      titleSpan.textContent = track.title;

      const artistSpan = document.createElement('span');
      artistSpan.className = 'lib-row-artist';
      artistSpan.textContent = track.artist;

      row.appendChild(titleSpan);
      row.appendChild(artistSpan);
      row.addEventListener('click', () => {
        switchTrack(i, true);
        closeLibrary();
      });
      libraryList.appendChild(row);
    });
  }

  const AUDIO_EXT_RE = /\.(mp3|m4a|wav|ogg|oga|flac|aac|weba)$/i;
  function isAudioFile(file) {
    return (file.type && file.type.startsWith('audio/')) || AUDIO_EXT_RE.test(file.name);
  }

  // "Artist - Title.mp3" (optionally prefixed with a track number) is the
  // most common naming convention; anything else just becomes the title.
  function parseFilenameMeta(filename) {
    const base = filename.replace(/\.[^/.]+$/, '');
    const cleaned = base.replace(/^\s*\d+[\s._-]+/, '').trim();
    const match = cleaned.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (match) {
      return { artist: match[1].trim(), title: match[2].trim() };
    }
    return { artist: 'Unknown Artist', title: cleaned || filename };
  }

  function readTags(file) {
    return new Promise((resolve) => {
      if (!window.jsmediatags) { resolve(null); return; }
      window.jsmediatags.read(file, {
        onSuccess: (tag) => resolve(tag.tags),
        onError: () => resolve(null),
      });
    });
  }

  // ---------------------------------------------------------------------
  // Persistence: the imported files themselves live in IndexedDB (as
  // Blobs) so the library survives a reload — object URLs alone don't.
  // ---------------------------------------------------------------------

  const DB_NAME = 'pulse-player';
  const STORE_NAME = 'tracks';
  let dbPromise = null;

  function getDB() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) { reject(new Error('indexedDB unavailable')); return; }
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(STORE_NAME)) {
            req.result.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }).catch((err) => {
        console.warn('Pulse: library persistence unavailable', err);
        return null;
      });
    }
    return dbPromise;
  }

  async function dbAddTrack(record) {
    const db = await getDB();
    if (!db) return null;
    return new Promise((resolve, reject) => {
      const store = db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME);
      const req = store.add(record);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetAllTracks() {
    const db = await getDB();
    if (!db) return [];
    return new Promise((resolve, reject) => {
      const store = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  // Guards against re-adding the same file twice (e.g. dropping the same
  // folder again in a later session, once it's already persisted).
  const knownFileKeys = new Set();

  async function addFiles(fileList) {
    const files = Array.from(fileList || []).filter(isAudioFile);
    if (!files.length) return;

    const wasEmpty = tracks.length === 0;
    let added = false;

    for (const file of files) {
      const dedupeKey = `${file.name}:${file.size}`;
      if (knownFileKeys.has(dedupeKey)) continue;
      knownFileKeys.add(dedupeKey);

      const fallback = parseFilenameMeta(file.name);
      const tags = await readTags(file);
      const title = (tags && tags.title) || fallback.title;
      const artist = (tags && tags.artist) || fallback.artist;

      const track = { id: null, title, artist, url: URL.createObjectURL(file) };
      tracks.push(track);
      added = true;
      renderLibrary();

      dbAddTrack({ title, artist, name: file.name, size: file.size, type: file.type, data: file })
        .then((id) => {
          track.id = id;
          if (id != null && tracks[trackIndex] === track) {
            localStorage.setItem('pulse:lastTrackId', id);
          }
        })
        .catch(() => {});
    }

    if (!added) return;
    rebuildOrder();
    renderLibrary();
    if (wasEmpty) hardSwitch(0, false);
  }

  async function loadLibraryFromDB() {
    let records = [];
    try {
      records = await dbGetAllTracks();
    } catch (err) {
      records = [];
    }
    records.forEach((rec) => {
      knownFileKeys.add(`${rec.name}:${rec.size}`);
      tracks.push({ id: rec.id, title: rec.title, artist: rec.artist, url: URL.createObjectURL(rec.data) });
    });
  }

  function restoreSettings() {
    const savedVolume = localStorage.getItem('pulse:volume');
    if (savedVolume !== null) volumeSlider.value = savedVolume;
    applyVolume();
    volumeIcon.style.opacity = Number(volumeSlider.value) === 0 ? '0.4' : '1';

    if (localStorage.getItem('pulse:shuffle') === '1') {
      shuffleBtn.classList.add('toggled');
      shuffleBtn.setAttribute('aria-pressed', 'true');
    }
    if (localStorage.getItem('pulse:repeat') === '1') {
      repeatBtn.classList.add('toggled');
      repeatBtn.setAttribute('aria-pressed', 'true');
    }
    if (localStorage.getItem('pulse:crossfade') === '1') {
      crossfadeBtn.classList.add('toggled');
      crossfadeBtn.setAttribute('aria-pressed', 'true');
    }

    const savedBass = localStorage.getItem('pulse:eqBass');
    const savedMid = localStorage.getItem('pulse:eqMid');
    const savedTreble = localStorage.getItem('pulse:eqTreble');
    if (savedBass !== null) eqBassSlider.value = savedBass;
    if (savedMid !== null) eqMidSlider.value = savedMid;
    if (savedTreble !== null) eqTrebleSlider.value = savedTreble;
  }

  async function init() {
    restoreSettings();
    await loadLibraryFromDB();

    let startIndex = 0;
    const lastId = Number(localStorage.getItem('pulse:lastTrackId'));
    if (lastId) {
      const idx = tracks.findIndex((t) => t.id === lastId);
      if (idx >= 0) startIndex = idx;
    }
    trackIndex = startIndex;
    rebuildOrder();
    hardSwitch(startIndex, false);
  }

  addFilesBtn.addEventListener('click', () => fileInput.click());
  addFolderBtn.addEventListener('click', () => folderInput.click());
  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });
  folderInput.addEventListener('change', () => {
    addFiles(folderInput.files);
    folderInput.value = '';
  });

  // Recursively walks dropped folders (Chrome/Edge/Firefox) via the
  // webkitGetAsEntry API; falls back to the flat file list elsewhere.
  async function collectFilesFromDataTransfer(dataTransfer) {
    const items = dataTransfer.items;
    if (!items || !items.length || !items[0].webkitGetAsEntry) {
      return Array.from(dataTransfer.files || []);
    }

    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
      if (entry) entries.push(entry);
    }

    async function readEntry(entry) {
      if (entry.isFile) {
        return [await new Promise((resolve, reject) => entry.file(resolve, reject))];
      }
      if (entry.isDirectory) {
        const reader = entry.createReader();
        let allEntries = [];
        let batch;
        do {
          batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          allEntries = allEntries.concat(batch);
        } while (batch.length > 0);
        const nested = await Promise.all(allEntries.map(readEntry));
        return nested.flat();
      }
      return [];
    }

    const results = await Promise.all(entries.map(readEntry));
    return results.flat();
  }

  let dragDepth = 0;
  function isFileDrag(e) {
    return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  }
  ['dragenter', 'dragover'].forEach((evt) => {
    window.addEventListener(evt, (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
      if (evt === 'dragenter') dragDepth++;
      dropOverlay.classList.add('active');
    });
  });
  window.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) dropOverlay.classList.remove('active');
  });
  window.addEventListener('drop', async (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragDepth = 0;
    dropOverlay.classList.remove('active');
    const files = await collectFilesFromDataTransfer(e.dataTransfer);
    addFiles(files);
  });

  init();
</script>

</body>
