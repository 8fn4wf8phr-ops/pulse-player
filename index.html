<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121A;
    --surface: #1E1B26;
    --surface-raised: #26222F;
    --text: #F2EFEA;
    --text-dim: #9A93A6;
    --accent: #FF5C7A;
    --accent-dim: rgba(255, 92, 122, 0.18);
    --track-bg: #362F42;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .player {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  .art {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius);
    background: linear-gradient(155deg, #3A2E45 0%, #241E2C 60%, #1A1621 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .art canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .track-info {
    margin-top: 22px;
    text-align: left;
  }

  .track-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .track-artist {
    font-size: 14px;
    color: var(--text-dim);
    margin: 0;
  }

  /* Progress */
  .progress-wrap {
    margin-top: 24px;
  }

  .progress-bar {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: var(--track-bg);
    cursor: pointer;
  }

  .progress-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
  }

  .progress-handle {
    position: absolute;
    top: 50%;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--text);
    transform: translate(-50%, -50%);
    left: 0%;
    box-shadow: 0 0 0 4px var(--accent-dim);
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .progress-bar:hover .progress-handle { opacity: 1; }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 26px;
  }

  .btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color 0.15s ease, transform 0.1s ease;
  }

  .btn:hover { color: var(--accent); }
  .btn:active { transform: scale(0.92); }

  .btn.secondary {
    color: var(--text-dim);
    width: 20px;
    height: 20px;
  }
  .btn.secondary svg { width: 18px; height: 18px; }

  .btn.skip svg { width: 22px; height: 22px; }

  .btn.play {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg);
  }
  .btn.play:hover { color: var(--bg); filter: brightness(1.08); }
  .btn.play svg { width: 22px; height: 22px; }

  .btn.toggled { color: var(--accent); }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
  }

  .volume-row svg {
    width: 16px;
    height: 16px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  input[type="range"].volume {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 999px;
    background: var(--track-bg);
    outline: none;
  }

  input[type="range"].volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }

  input[type="range"].volume::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--text);
    cursor: pointer;
    box-shadow: 0 0 0 4px var(--accent-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn, .progress-handle { transition: none; }
  }

  .btn:focus-visible,
  input.volume:focus-visible,
  .progress-bar:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="player">
  <div class="art" aria-hidden="true">
    <canvas id="visualizer"></canvas>
  </div>

  <div class="track-info">
    <p class="track-title" id="trackTitle">—</p>
    <p class="track-artist" id="trackArtist">Add a track to get started</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-handle" id="progressHandle"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="shuffleBtn" aria-label="Shuffle" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
    </button>

    <button class="btn skip" id="prevBtn" aria-label="Previous track">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l10 6.5v-13z"></path></svg>
    </button>

    <button class="btn play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg>
    </button>

    <button class="btn skip" id="nextBtn" aria-label="Next track">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 5.5v13l10-6.5z"></path></svg>
    </button>

    <button class="btn secondary" id="repeatBtn" aria-label="Repeat" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
    </button>
  </div>

  <div class="volume-row">
    <svg id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
    <input type="range" class="volume" id="volumeSlider" min="0" max="100" value="70" aria-label="Volume">
  </div>
</div>

<audio id="audio"></audio>

<script>
  const audio = document.getElementById('audio');
  const canvas = document.getElementById('visualizer');
  const canvasCtx = canvas.getContext('2d');
  const artEl = document.querySelector('.art');
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FF5C7A';

  let audioCtx, analyser, sourceNode, dataArray, bufferLength;
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const num = parseInt(h, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }
  const accentRgb = hexToRgb(accentColor);
  function accentAlpha(a) { return `rgba(${accentRgb.r}, ${accentRgb.g}, ${accentRgb.b}, ${a})`; }

  function resizeCanvas() {
    const size = artEl.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // Web Audio graph can only be created after a user gesture, and
  // createMediaElementSource can only ever be called once per <audio> element.
  function setupAudioGraph() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.8;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function drawIdle(time) {
    const size = artEl.clientWidth;
    const cx = size / 2, cy = size / 2;
    const breathe = prefersReducedMotion ? 0 : Math.sin(time / 1200) * 0.04;
    const baseR = size * 0.16;

    canvasCtx.clearRect(0, 0, size, size);

    [0.42, 0.66, 0.88].forEach((mult, i) => {
      canvasCtx.beginPath();
      canvasCtx.arc(cx, cy, size * mult * (1 + (i === 0 ? breathe : 0)) / 2, 0, Math.PI * 2);
      canvasCtx.strokeStyle = accentAlpha(0.35 - i * 0.11);
      canvasCtx.lineWidth = 1.5;
      canvasCtx.stroke();
    });

    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, baseR * (1 + breathe), 0, Math.PI * 2);
    canvasCtx.fillStyle = accentAlpha(0.16);
    canvasCtx.fill();
  }

  function drawActive() {
    const size = artEl.clientWidth;
    const cx = size / 2, cy = size / 2;
    analyser.getByteFrequencyData(dataArray);

    canvasCtx.clearRect(0, 0, size, size);

    // Bass-driven pulsing core (average of the lowest few bins)
    const bassBins = 4;
    let bassSum = 0;
    for (let i = 0; i < bassBins; i++) bassSum += dataArray[i];
    const bassAvg = bassSum / bassBins / 255;
    const coreR = size * 0.14 * (1 + bassAvg * 0.5);

    canvasCtx.beginPath();
    canvasCtx.arc(cx, cy, coreR, 0, Math.PI * 2);
    canvasCtx.fillStyle = accentAlpha(0.25 + bassAvg * 0.25);
    canvasCtx.shadowColor = accentAlpha(0.5);
    canvasCtx.shadowBlur = size * 0.06 * (0.5 + bassAvg);
    canvasCtx.fill();
    canvasCtx.shadowBlur = 0;

    // Radial frequency bars
    const numBars = bufferLength;
    const baseRadius = size * 0.2;
    const maxBarLength = size * 0.18;
    const lineWidth = Math.max(1.5, size * 0.008);

    canvasCtx.lineCap = 'round';
    canvasCtx.lineWidth = lineWidth;

    for (let i = 0; i < numBars; i++) {
      const value = dataArray[i] / 255;
      const angle = (i / numBars) * Math.PI * 2 - Math.PI / 2;
      const barLen = Math.max(size * 0.01, value * maxBarLength);
      const x1 = cx + Math.cos(angle) * baseRadius;
      const y1 = cy + Math.sin(angle) * baseRadius;
      const x2 = cx + Math.cos(angle) * (baseRadius + barLen);
      const y2 = cy + Math.sin(angle) * (baseRadius + barLen);

      canvasCtx.strokeStyle = accentAlpha(0.35 + value * 0.65);
      canvasCtx.beginPath();
      canvasCtx.moveTo(x1, y1);
      canvasCtx.lineTo(x2, y2);
      canvasCtx.stroke();
    }
  }

  function animate(time) {
    requestAnimationFrame(animate);
    if (analyser && isPlaying) {
      drawActive();
    } else {
      drawIdle(time || 0);
    }
  }
  requestAnimationFrame(animate);

  let isPlaying = false;
  let isSeeking = false;

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressHandle = document.getElementById('progressHandle');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  audio.volume = volumeSlider.value / 100;

  // Add your own tracks here. Files should live in a "songs" folder
  // next to this HTML file, e.g. songs/song-one.mp3
  const tracks = [
    { title: 'Song One', artist: 'Artist Name', src: 'song-one.mp3' },
    { title: 'Song Two', artist: 'Artist Name', src: 'song-two.mp3' },
  ];

  let trackIndex = 0;

  function loadTrack(index, autoplay = false) {
    if (!tracks.length) return;
    trackIndex = (index + tracks.length) % tracks.length;
    const track = tracks[trackIndex];
    audio.src = track.src;
    document.getElementById('trackTitle').textContent = track.title;
    document.getElementById('trackArtist').textContent = track.artist;
    progressFill.style.width = '0%';
    progressHandle.style.left = '0%';
    currentTimeEl.textContent = '0:00';
    durationEl.textContent = '0:00';
    if (autoplay) audio.play().catch(() => {});
  }

  if (tracks.length) loadTrack(0);

  function formatTime(seconds) {
    if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }

  playBtn.addEventListener('click', () => {
    if (!tracks.length) return; // add tracks to the array above first
    setupAudioGraph();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (isPlaying) {
      audio.pause();
    } else {
      audio.play().catch(() => {});
    }
  });

  audio.addEventListener('play', () => setPlayingUI(true));
  audio.addEventListener('pause', () => setPlayingUI(false));

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressHandle.style.left = pct + '%';
    progressBar.setAttribute('aria-valuenow', Math.round(pct));
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  function seekToClientX(clientX) {
    const rect = progressBar.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    progressFill.style.width = (pct * 100) + '%';
    progressHandle.style.left = (pct * 100) + '%';
    if (audio.duration) {
      audio.currentTime = pct * audio.duration;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    }
  }

  progressBar.addEventListener('pointerdown', (e) => {
    isSeeking = true;
    seekToClientX(e.clientX);
    progressBar.setPointerCapture(e.pointerId);
  });
  progressBar.addEventListener('pointermove', (e) => {
    if (isSeeking) seekToClientX(e.clientX);
  });
  progressBar.addEventListener('pointerup', () => { isSeeking = false; });
  progressBar.addEventListener('keydown', (e) => {
    if (!audio.duration) return;
    if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
    if (e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime - 5);
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value / 100;
    volumeIcon.style.opacity = audio.volume === 0 ? '0.4' : '1';
  });

  shuffleBtn.addEventListener('click', () => {
    const active = shuffleBtn.classList.toggle('toggled');
    shuffleBtn.setAttribute('aria-pressed', active);
  });

  repeatBtn.addEventListener('click', () => {
    const active = repeatBtn.classList.toggle('toggled');
    repeatBtn.setAttribute('aria-pressed', active);
    audio.loop = active;
  });

  prevBtn.addEventListener('click', () => {
    // Restart current track if more than 3s in, otherwise go to previous track
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
    } else {
      loadTrack(trackIndex - 1, isPlaying);
    }
  });

  nextBtn.addEventListener('click', () => {
    loadTrack(trackIndex + 1, isPlaying);
  });

  audio.addEventListener('ended', () => {
    if (!repeatBtn.classList.contains('toggled')) {
      loadTrack(trackIndex + 1, true);
    }
  });
</script>

</body>
</html>
